<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بیان امن و اثربخش · Safe and Effective Expression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f3ea; --ink:#2a2420; --muted:#6e645a; --line:#e6dccd; --paper:#fffdf8; --soft:#f1e8da;
  --accent:#b4485b; --accent2:#2f6f6a;
  --feel:#d98a2b; --need:#4c9a6a; --obs:#8a5fb0; --req:#d9673d; --sc:#b4485b; --jk:#8b6a3e; --ps:#5e6b78;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9}
html[lang=en] body{line-height:1.7}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .serif{font-family:Lora,Georgia,serif}
a{color:var(--accent2)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(248,243,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:800;font-size:1.15rem;white-space:nowrap}
.brand svg{width:34px;height:34px}
.links{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto}
.links a{text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:.93rem;white-space:nowrap}
.links a.on{background:var(--ink);color:#fff}
.lang{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink);white-space:nowrap}
@media(max-width:760px){.top .in{flex-wrap:wrap}.links{order:3;width:100%;margin:0}}
main{max-width:1080px;margin:0 auto;padding:0 18px 70px}
.view{display:none}.view.on{display:block}
/* hero */
.hero{position:relative;text-align:center;padding:70px 10px 50px;overflow:hidden}
.hero .pattern{position:absolute;inset:0;opacity:.18;pointer-events:none}
.hero h1{position:relative;margin:0;font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;letter-spacing:-.01em}
.hero .alt{position:relative;color:var(--accent);font-size:1.1rem;margin-top:2px}
.hero p.lead{position:relative;max-width:620px;margin:18px auto 0;font-size:1.15rem;color:var(--muted)}
.cta{position:relative;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;font:inherit;border:0;border-radius:14px;padding:10px 22px;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 16px;font-size:.92rem}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0 40px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;color:var(--ink);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;margin-bottom:10px}
.tile h3{margin:0 0 4px}
.tile p{margin:0;color:var(--muted);font-size:.95rem}
.idea{text-align:center;background:var(--soft);border-radius:20px;padding:26px;font-size:1.2rem;font-weight:600}
.idea small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:4px}
/* sections */
.pagehead{padding:44px 0 10px}
.pagehead h1{margin:0;font-size:clamp(1.8rem,4.5vw,2.6rem)}
.pagehead p{margin:6px 0 0;color:var(--muted);max-width:720px}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:24px 0}
.st{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;border-top:6px solid var(--c)}
.st .n{font-weight:800;color:var(--c);font-size:.9rem}
.st h3{margin:2px 0 6px}
.st p{margin:0 0 8px;font-size:.95rem}
.st .ex{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem}
.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 24px;margin:16px 0}
.box h2{margin:0 0 6px;font-size:1.3rem}
.full{background:var(--ink);color:#fff;border-radius:18px;padding:20px 24px;font-size:1.1rem;font-weight:600;margin:16px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.animal{border-radius:16px;padding:16px 18px}
.animal h3{margin:0 0 4px}
ol.ways{margin:6px 0 0;padding-inline-start:22px}
/* pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;margin:10px 0 24px;overflow:hidden}
.pl{padding:22px 24px;text-align:center}
.pl+.pl{border-inline-start:1px solid var(--line)}
.pl .pi{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:1.2rem}
.pl h3{margin:0 0 4px;color:var(--c);font-size:1.25rem}
.pl p{margin:0;color:var(--muted);font-size:.93rem}
@media(max-width:700px){.pillars{grid-template-columns:1fr}.pl+.pl{border-inline-start:0;border-top:1px solid var(--line)}}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:20px 0}
.sk{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;border-inline-start:6px solid var(--accent2)}
.sk .n{font-size:.8rem;color:var(--accent2);font-weight:800}
.sk h3{margin:0 0 4px}
.sk p{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.sk ul{margin:0 0 8px;padding-inline-start:20px;font-size:.93rem}
.sk .ex{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.92rem}
.win{background:linear-gradient(135deg,#2f6f6a,#24524e);color:#fff;border-radius:20px;padding:22px 26px;margin:20px 0}
.win h2{margin:0 0 6px}
.verse{font-weight:600;line-height:2.2}
.verse small{display:block;font-weight:400;opacity:.75;font-size:.85rem}
/* games */
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0}
.gtabs button{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gpanel h2{margin:0 0 2px;font-size:1.5rem}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.rules{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:20px}
.rules ol{margin:6px 0 0;padding-inline-start:22px}
html[lang=fa] .rules ol{list-style-type:persian}
.frame{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:600}
.play{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px 0 26px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hand{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:40px}
.hint{font-size:.82rem;color:var(--muted)}
.card{width:190px;min-height:250px;border-radius:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 18px rgba(60,40,20,.08);display:flex;flex-direction:column;overflow:hidden}
.card .band{height:12px;background:var(--c)}
.card .kind{font-size:.75rem;color:var(--c);font-weight:600;padding:8px 14px 0}
.card .face{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px;font-weight:600;font-size:1.05rem}
.card .face.big{font-size:1.5rem;font-weight:800}
.card .sub{font-size:.78rem;color:var(--muted);text-align:center;padding:0 12px 12px}
.card.wide{width:min(420px,92vw);min-height:220px}
.card .back{display:none;border-top:1px dashed var(--line);padding:10px 16px 14px;font-size:.9rem;background:#fbf7f0}
.card.flipped .back{display:block}
.card .tag{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:800;color:#fff;background:var(--c);margin-bottom:4px}
.card.clickable{cursor:pointer}
details.deck summary{cursor:pointer;color:var(--muted);margin-bottom:12px}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.grid .card{width:160px;min-height:200px}
.grid .card.wide{width:300px;min-height:200px}
.grid .card .back{display:block}
.dh{width:100%;margin:18px 0 8px;font-size:1.1rem}
/* decks */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:24px 0}
.dk{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dk .art{height:150px;display:flex;align-items:center;justify-content:center;gap:-20px;background:var(--soft)}
.dk .art span{width:70px;height:96px;border-radius:10px;background:var(--paper);border:1px solid var(--line);border-top:8px solid var(--c);box-shadow:0 4px 10px rgba(0,0,0,.08);display:grid;place-items:center;font-weight:800;font-size:.85rem;margin:0 -10px}
.dk .art span:nth-child(1){transform:rotate(-8deg)}.dk .art span:nth-child(3){transform:rotate(8deg)}
.dk .body{padding:16px 18px}
.dk h3{margin:0 0 4px}
.dk p{margin:0;font-size:.93rem;color:var(--muted)}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:600}
.ph{background:#fff4c9;border-radius:6px;padding:0 4px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.85rem;padding:24px 18px}
@media print{.top,footer,.play,.rules,.gtabs,.pagehead,.meta,.gpanel h2{display:none!important}details.deck .grid{display:flex!important}}
</style>
</head>

 learnP:{fa:"دکتر مارشال روزنبرگ، روان‌شناس آمریکایی، روشی ساده پیشنهاد کرد: به‌جای سرزنش و قضاوت، آنچه را می‌بینیم، حس می‌کنیم، نیاز داریم و درخواست می‌کنیم روشن بگوییم.",en:"Psychologist Dr. Marshall Rosenberg proposed a simple path: instead of blame and judgment, say clearly what we observe, feel, need and request."},
 fnH:{fa:"احساس و نیاز: دو چیز جدا",en:"Feelings and needs: two different things"},
 fnP:{fa:"احساس (مثل نگرانی یا شادی) چیزی است که در بدن و دل تجربه می‌کنیم. نیاز (مثل امنیت یا احترام) چیزی است که برای همه‌ی انسان‌ها مهم است و ریشه‌ی آن احساس است. وقتی نیازی برآورده می‌شود، احساس خوشایند داریم و وقتی برآورده نمی‌شود، احساس ناخوشایند. برای همین در بازی‌ها، کارت‌های احساس و کارت‌های نیاز دو دسته‌ی جدا هستند.",en:"A feeling (like worry or joy) is what we experience in body and heart. A need (like safety or respect) is something every human shares, and it is the root of the feeling. When a need is met, we feel pleasant feelings; when it isn't, unpleasant ones. That's why the games keep feeling cards and need cards as two separate decks."},

 notifyH:{fa:"باخبر شوید",en:"Stay in touch"},
 notifyP:{fa:"برای اطلاع از عرضه‌ی کارت‌ها، به ما ایمیل بزنید: <a href='mailto:mehrvamarz@gmail.com' dir='ltr'>mehrvamarz@gmail.com</a>",en:"To hear when the decks are released, email us at <a href='mailto:mehrvamarz@gmail.com' dir='ltr'>mehrvamarz@gmail.com</a>"},
 aboutH:{fa:"درباره‌ی «بیان امن و اثربخش»",en:"About Safe and Effective Expression"},
 storyH:{fa:"داستان من",en:"My story"},
 story:{fa:"<p>سلام، من زهره هستم. ارتباط بدون خشونت شیوه‌ی گفت‌وگوی مرا با خودم و دیگران تغییر داد. دیدم که چقدر کم پیش می‌آید این ابزارها به زبان فارسی، ساده و بازی‌گونه، در دسترس باشند.</p><p>برای همین کارم را رها کردم تا تمام وقتم را صرف این پروژه کنم. بیان امن و اثربخش کاری مستقل و فردی است؛ بدون سازمان، تیم یا سرمایه‌ی بیرونی، و تنها با این امید که همدلی در خانه‌ها و کلاس‌های ما جای بیشتری پیدا کند.</p>",
        en:"<p>Hi, I'm Zohreh. Nonviolent Communication changed the way I speak with myself and with others. I also saw how rarely these tools are available in Farsi in a simple, playful form.</p><p>So I left my job to give this project my full time. Safe and Effective Expression is an independent, one-person effort, with no organization, team or outside funding behind it, only the hope that empathy can take up more space in our homes and classrooms.</p>"},
 missionH:{fa:"مأموریت",en:"Mission"},
 mission:{fa:"<p>زبان، پلی میان دل‌هاست. در خانه، مدرسه و محیط کار، همه‌ی ما گاهی نمی‌دانیم چطور حرف دلمان را بگوییم، بی‌آنکه دیگری را بیازاریم یا خودمان آزرده شویم.</p><p>«بیان امن و اثربخش» می‌خواهد ابزارهایی ساده، رایگان و شاد برای روشن گفتن و از دل شنیدن، به زبان فارسی، در دسترس هر خانواده، هر معلم و هر فارسی‌زبانی قرار دهد؛ تا گفت‌وگوهایمان جایی امن‌تر و گرم‌تر برای همه باشد.</p>",
        en:"<p>Language is a bridge between hearts. At home, at school and at work, all of us sometimes struggle to say what is in our hearts without hurting others or being hurt ourselves.</p><p>Safe and Effective Expression offers simple, free and joyful tools in Farsi for speaking clearly and listening from the heart, for every family, every teacher and every Persian speaker, so that our conversations can become safer and warmer places for everyone.</p>"},
 creditH:{fa:"منبع و قدردانی",en:"Credit"},
 credit:{fa:"<p>محتوای این سایت بر پایه‌ی آثار دکتر مارشال روزنبرگ و مرکز ارتباط بدون خشونت (<a href='https://www.cnvc.org'>cnvc.org</a>) است. بیان امن و اثربخش پروژه‌ای مستقل است و وابسته به آن مرکز یا مورد تأیید رسمی آن نیست. برای آموزش عمیق‌تر، به مربیان رسمی آن مرکز مراجعه کنید.</p>",
        en:"<p>This site is based on the work of Dr. Marshall Rosenberg and the Center for Nonviolent Communication (<a href='https://www.cnvc.org'>cnvc.org</a>). Safe and Effective Expression is an independent project and is not affiliated with or endorsed by CNVC. For deeper learning, please seek out CNVC Certified Trainers.</p>"},
 copy:{fa:"© ۲۰۲۶ زهره · مهر و مرز. تمامی حقوق محفوظ است.",en:"© 2026 Zohreh · MehrVaMarz. All rights reserved."},

const ix=()=>L==="fa"?0:1;
function wordCard(word,kind,color,sub){return `<div class="card" style="--c:${color}"><div class="band"></div><div class="kind">${t(kind)}</div><div class="face big">${esc(word)}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`}
function quizCard(text,kind,color,tag,ans,f){return `<div class="card wide ${f?"clickable":""}" style="--c:${color}"><div class="band"></div><div class="kind">${t(kind)}</div><div class="face">${esc(text)}</div><div class="back"><span class="tag">${t(tag)}</span><div>${esc(ans)}</div></div></div>`}
const fMet=w=>wordCard(w[ix()],K.feel,"var(--feel)",t(K.pleasant));
const fUn=w=>wordCard(w[ix()],K.feel,"var(--feel)",t(K.unpleasant));
const needC=n=>wordCard(n[ix()],K.need,"var(--need)",t(K.cat)+CAT[n[2]][ix()]);
const obsC=(o,f)=>quizCard(t(o[0]),K.obs,"var(--obs)",o[1]?K.o1:K.o0,t(o[2]),f);
const reqC=(o,f)=>quizCard(t(o[0]),K.req,"var(--req)",o[1]?K.r1:K.r0,t(o[2]),f);
const psC=(o,f)=>quizCard(t(o[0]),K.ps,"var(--ps)",o[1]?K.p1:K.p0,t(o[2]),f);
const scC=s=>`<div class="card wide" style="--c:var(--sc)"><div class="band"></div><div class="kind">${t(K.sc)}</div><div class="face">${esc(t(s))}</div></div>`;
const jkC=(j,f)=>quizCard((L==="fa"?"«":"“")+t(j[0])+(L==="fa"?"»":"”"),K.jk,"var(--jk)",K.gr,t(j[1]),f);
const clC=(c,f)=>quizCard(t(c[0]),{fa:"روشن بگو",en:"Say it clearly"},"#24524e",{fa:"نسخه‌ی روشن",en:"Clear version"},t(c[1]),f);
const anyFeel=()=>Math.random()<.5?fMet(pick(FEEL_MET)):fUn(pick(FEEL_UNMET));
const allFeel=()=>FEEL_MET.map(fMet).join("")+FEEL_UNMET.map(fUn).join("");

const DECKS={

 req:{draw:()=>[reqC(pick(REQ),1)],flip:1,all:()=>`<div class="grid">${REQ.map(o=>reqC(o)).join("")}</div>`},

 jackal:{draw:()=>[jkC(pick(JACKAL),1)],flip:1,all:()=>`<div class="grid">${JACKAL.map(j=>jkC(j)).join("")}</div>`}
};

/* ---------- RENDER ---------- */
const VIEWS=["home","learn","skills","play","decks","about"];
let currentGame="detective";

function renderStatic(){
  document.documentElement.lang=L; document.documentElement.dir=L==="fa"?"rtl":"ltr";
  document.title=L==="fa"?"بیان امن و اثربخش · Safe and Effective Expression":"Safe and Effective Expression · بیان امن و اثربخش";
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(UI[el.dataset.t])});
  document.getElementById("langBtn").textContent=t(UI.lang);
  document.getElementById("links").innerHTML=VIEWS.map(v=>`<a href="#${v}" data-v="${v}">${t(UI.nav[v])}</a>`).join("");
  document.getElementById("steps4").innerHTML=STEPS.map(s=>`<div class="st" style="--c:${s.c}"><div class="n">${t(s.n)}</div><h3>${t(s.h)}</h3><p>${t(s.p)}</p><div class="ex">${t(s.ex)}</div></div>`).join("");
  document.getElementById("fullSentence").textContent=t(FULL);
  document.getElementById("skills").innerHTML=SKILLS.map((k,i)=>`<div class="sk"><div class="n">${L==="fa"?(i+1).toLocaleString("fa-IR"):i+1}</div><h3>${t(k.h)}</h3><p>${t(k.p)}</p><ul>${t(k.b).map(x=>`<li>${x}</li>`).join("")}</ul><div class="ex">${t(k.ex)}</div></div>`).join("");
  document.getElementById("ways").innerHTML=WAYS.map(w=>`<li>${t(w)}</li>`).join("");
  document.getElementById("decks").innerHTML=DECKS_SOON.map(d=>`<div class="dk" style="--c:${d.c}"><div class="art">${(L==="fa"?d.s:d.se).map(x=>`<span>${x}</span>`).join("")}</div><div class="body"><h3>${t(d.h)}</h3><p>${t(d.p)}</p></div></div>`).join("");
  document.getElementById("gtabs").innerHTML=GAMES.map(g=>`<button data-g="${g.id}">${t(g.name)}</button>`).join("");
  renderGame(); route();
}
function renderGame(){
  const g=GAMES.find(x=>x.id===currentGame), d=DECKS[g.deck];
  document.querySelectorAll("#gtabs button").forEach(b=>b.classList.toggle("on",b.dataset.g===g.id));
  const p=document.getElementById("gpanel");
  p.innerHTML=`<h2 style="color:${g.color}">${t(g.name)}</h2><div class="meta">${t(g.meta)}</div>
   <div class="rules"><b>${t(UI.howTo)}</b><ol>${t(g.rules).map(r=>`<li>${r}</li>`).join("")}</ol><div class="frame">${t(g.frame)}</div></div>
   <div class="play"><div class="btns"><button class="btn draw">${t(d.both?UI.drawBoth:UI.draw)}</button><button class="btn alt clear">${t(UI.clear)}</button></div>
   <div class="hand"></div>${d.flip?`<div class="hint">${t(UI.tapHint)}</div>`:""}</div>
   <details class="deck"><summary>${t(UI.allCards)}</summary>${d.all()}</details>`;
  const hand=p.querySelector(".hand");
  p.querySelector(".draw").onclick=()=>{hand.innerHTML=d.draw().join("")};
  p.querySelector(".clear").onclick=()=>{hand.innerHTML=""};
  hand.addEventListener("click",e=>{const c=e.target.closest(".card.clickable");if(c)c.classList.toggle("flipped")});
}
function route(){
  const h=location.hash.slice(1); const v=VIEWS.includes(h)?h:"home";
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("#links a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});
document.getElementById("gtabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){currentGame=b.dataset.g;renderGame()}});
document.getElementById("langBtn").onclick=()=>{L=L==="fa"?"en":"fa";try{localStorage.setItem("zd-lang",L)}catch(e){}renderStatic()};
renderStatic();
</script>
